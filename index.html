                if (flags & 0x10 && r + 4 <= q + csz) tfhdDefaultSampleSize = view.getUint32(r, false);
              } else if (ctp === "trun") {
                trunBox = { offset: q, size: csz };
              } else if (ctp === "senc") {
                sencBox = { offset: q, size: csz };
              } else if (ctp === "pssh" || ctp === "saio" || ctp === "saiz" || ctp === "sbgp" || ctp === "sgpd") {
                writeAscii4(u8, q + 4, "free");
                u8.fill(0, q + 8, q + csz);
              }
              q += csz;
            }

            if (trunBox && sencBox) trafList.push({
              tfhdDefaultSampleSize: tfhdDefaultSampleSize,
              trunBox: trunBox,
              sencBox: sencBox
            });
          }
          p += bsz;
        }

        for (var ti = 0; ti < trafList.length; ti++) {
          var trun = trafList[ti].trunBox;
          var senc = trafList[ti].sencBox;
          var defaultSize = trafList[ti].tfhdDefaultSampleSize;
          var trunFlags = view.getUint32(trun.offset + 8, false) & 0xffffff;
          var sampleCount = view.getUint32(trun.offset + 12, false);
          if (sampleCount > 100000) break;

          var tPos = trun.offset + 16;
          var dataOffset = 0;
          if (trunFlags & 0x01) {
            dataOffset = view.getInt32(tPos, false);
            tPos += 4;
          }
          if (trunFlags & 0x04) tPos += 4;

          var sampleSizes = new Uint32Array(sampleCount);
          for (var i = 0; i < sampleCount; i++) {
            if (trunFlags & 0x100) tPos += 4;
            if (trunFlags & 0x200) {
              sampleSizes[i] = view.getUint32(tPos, false);
              tPos += 4;
            } else {
              sampleSizes[i] = defaultSize;
            }
            if (trunFlags & 0x400) tPos += 4;
            if (trunFlags & 0x800) tPos += 4;
          }

          var sencFlags = view.getUint32(senc.offset + 8, false) & 0xffffff;
          var sencCount = view.getUint32(senc.offset + 12, false);
          var sPos = senc.offset + 16;
          var mediaCursor = moofOffset + dataOffset;
          var count = Math.min(sampleCount, sencCount);

          for (var j = 0; j < count; j++) {
            var iv = new Uint8Array(16);
            iv.set(u8.subarray(sPos, sPos + 8), 0);
            sPos += 8;
            var sampleSize = sampleSizes[j];

            if (sencFlags & 0x02) {
              var subCount = view.getUint16(sPos, false);
              sPos += 2;
              var ranges = [];
              var totalEnc = 0;
              var subCursor = mediaCursor;
              for (var k = 0; k < subCount; k++) {
                var clearBytes = view.getUint16(sPos, false);
                var encBytes = view.getUint32(sPos + 2, false);
                sPos += 6;
                subCursor += clearBytes;
                if (encBytes > 0 && subCursor + encBytes <= u8.byteLength) {
                  if (encBytes > u8.byteLength) break;
                  ranges.push({ start: subCursor, len: encBytes });
                  totalEnc += encBytes;
                }
                subCursor += encBytes;
              }

              if (totalEnc > 0 && totalEnc <= u8.byteLength) {
                var cipherBuf;
                if (ranges.length === 1) {
                  cipherBuf = u8.subarray(ranges[0].start, ranges[0].start + ranges[0].len);
                } else {
                  cipherBuf = new Uint8Array(totalEnc);
                  var cOff = 0;
                  for (var ri = 0; ri < ranges.length; ri++) {
                    cipherBuf.set(u8.subarray(ranges[ri].start, ranges[ri].start + ranges[ri].len), cOff);
                    cOff += ranges[ri].len;
                  }
                }
                (function (buf, ivBuf, outRanges) {
                  decryptJobs.push(
                    global.crypto.subtle
                      .decrypt({ name: "AES-CTR", counter: ivBuf, length: 64 }, cryptoKey, buf)
                      .then(function (plainAb) {
                        var plain = new Uint8Array(plainAb);
                        var po = 0;
                        for (var x = 0; x < outRanges.length; x++) {
                          u8.set(plain.subarray(po, po + outRanges[x].len), outRanges[x].start);
                          po += outRanges[x].len;
                        }
                      })
                  );
                })(cipherBuf, iv, ranges);
              }
            } else if (sampleSize > 0 && mediaCursor + sampleSize <= u8.byteLength) {
              var targetOffset = mediaCursor;
              var slice = u8.subarray(targetOffset, targetOffset + sampleSize);
              (function (buf, ivBuf, dest) {
                decryptJobs.push(
                  global.crypto.subtle
                    .decrypt({ name: "AES-CTR", counter: ivBuf, length: 64 }, cryptoKey, buf)
                    .then(function (plainAb) { u8.set(new Uint8Array(plainAb), dest); })
                );
              })(slice, iv, targetOffset);
            }
            mediaCursor += sampleSize;
          }

          writeAscii4(u8, senc.offset + 4, "free");
          u8.fill(0, senc.offset + 8, senc.offset + senc.size);
        }
      }
      off += sz;
    }

    if (decryptJobs.length) await Promise.all(decryptJobs);
    return u8;
  }

  /* ------------------------------------------------------------------
   * 4b. Shift absolute timestamps so a segment starts at zero while the
   *     spacing between its fragments (CMAF segments carry 2+) is kept.
   *     timestampOffset is then applied per segment number.
   * ------------------------------------------------------------------ */
  function normalizeMp4SegmentToZeroTimeInPlace(u8) {
    if (!u8 || u8.byteLength < 16) return u8;
    var view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var tfdtBoxes = [];

    (function walk(start, end, depth) {
      if (depth > 8) return;
      var off = start;
      while (off + 8 <= end) {
        var sz = view.getUint32(off, false);
        var tp = readAscii4(u8, off + 4);
        if (sz === 0) sz = end - off;
        if (sz < 8 || off + sz > end) break;

        if (tp === "sidx" && sz >= 28) {
          var sv = u8[off + 8];
          view.setUint32(off + 20, 0, false);
          view.setUint32(off + 24, 0, false);
          if (sv === 1 && sz >= 36) {
            view.setUint32(off + 28, 0, false);
            view.setUint32(off + 32, 0, false);
          }
        } else if (tp === "tfdt" && sz >= 16) {
          tfdtBoxes.push({ offset: off, size: sz, version: u8[off + 8] });
        } else if (tp === "moov" || tp === "trak" || tp === "mdia" || tp === "minf" ||
                   tp === "stbl" || tp === "edts" || tp === "mvex" || tp === "moof" || tp === "traf") {
          walk(off + 8, off + sz, depth + 1);
        }
        off += sz;
      }
    })(0, u8.byteLength, 0);

    if (!tfdtBoxes.length) return u8;

    function readTfdt(box) {
      if (box.version === 1 && box.size >= 20) {
        return view.getUint32(box.offset + 12, false) * 4294967296 + view.getUint32(box.offset + 16, false);
      }
      return view.getUint32(box.offset + 12, false);
    }

    var base = readTfdt(tfdtBoxes[0]);
    for (var i = 0; i < tfdtBoxes.length; i++) {
      var b = tfdtBoxes[i];
      var value = Math.max(0, readTfdt(b) - base);
      if (b.version === 1 && b.size >= 20) {
        view.setUint32(b.offset + 12, Math.floor(value / 4294967296), false);
        view.setUint32(b.offset + 16, value >>> 0, false);
      } else {
        view.setUint32(b.offset + 12, value >>> 0, false);
      }
    }
    return u8;
  }

  /* ------------------------------------------------------------------
   * 5. Manifest parsing — first Period only (the live one).
   * ------------------------------------------------------------------ */
  function isAbsoluteUrl(u) { return /^https?:\/\//i.test(String(u || "")); }

  function resolveMedia(media, base) {
    if (!media) return "";
    if (isAbsoluteUrl(media)) return media;
    // Signed MPDs often use relative media names. Insert the MPD query
    // after the filename so Akamai's hdntl token reaches every segment.
    var queryIndex = String(base || "").indexOf("?");
    if (queryIndex < 0) return base + media;
    return base.slice(0, queryIndex) + media + base.slice(queryIndex);
  }

  // The signed MPD gives absolute media URLs (with an hdntl token) but a bare
  // init filename. Rebuild the init URL from the media URL so it inherits the
  // same signed query string.
  function resolveInit(init, media, base) {
    if (!init) return "";
    if (isAbsoluteUrl(init)) return init;
    if (!isAbsoluteUrl(media)) return base + init;
    var query = "";
    var qi = init.indexOf("?");
    if (qi >= 0) query = init.slice(qi);
    else if (media.indexOf("?") >= 0) query = media.slice(media.indexOf("?"));
    var name = init.split("?")[0];
    var mediaPath = media.split("?")[0];
    return mediaPath.replace(/[^/]+$/, "") + name + query;
  }

  function parseIsoDuration(str) {
    var m = /^PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(str || "");
    if (!m) return 0;
    return (Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60 + (Number(m[3]) || 0);
  }

  function parseMpd(text, baseUrl, nowMs, wantedHeight) {
    var doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("Invalid MPD XML");

    var mpd = doc.getElementsByTagName("MPD")[0];
    if (!mpd) throw new Error("No MPD element");
    var astMs = Date.parse(mpd.getAttribute("availabilityStartTime") || "") || Date.now();
    var now = Number(nowMs) || Date.now();

    var periods = mpd.getElementsByTagName("Period");
    if (!periods.length) throw new Error("No Period in MPD");

    // Pick the last Period that has already started. Live channels add new
    // Periods with fresh startNumbers while keeping the old ones in the MPD.
    var periodIndex = 0;
    var periodStartMs = astMs;
    for (var pi = 0; pi < periods.length; pi++) {
      var startMs = astMs + parseIsoDuration(periods[pi].getAttribute("start")) * 1000;
      if (startMs <= now + 3000) {
        periodIndex = pi;
        periodStartMs = startMs;
      }
    }
    var period = periods[periodIndex];

    function readTemplate(adaptation, wantedHeight, tplBase) {
      var reps = adaptation.getElementsByTagName("Representation");
      var rep = null;
      if (wantedHeight) {
        for (var ri = 0; ri < reps.length; ri++) {
          if (Number(reps[ri].getAttribute("height")) === wantedHeight) { rep = reps[ri]; break; }
        }
      }
      if (!rep) rep = reps[0];
      var tmpl = rep ? rep.getElementsByTagName("SegmentTemplate")[0] : null;
      if (!tmpl) tmpl = adaptation.getElementsByTagName("SegmentTemplate")[0];
      if (!tmpl) return null;

      return {
        timescale: Number(tmpl.getAttribute("timescale")) || 90000,
        duration: Number(tmpl.getAttribute("duration")) || 0,
        startNumber: Number(tmpl.getAttribute("startNumber")) || 0,
        media: resolveMedia(tmpl.getAttribute("media") || "", tplBase),
        initialization: resolveInit(
          tmpl.getAttribute("initialization") || "",
          resolveMedia(tmpl.getAttribute("media") || "", tplBase),
          tplBase
        ),
        codecs: rep ? (rep.getAttribute("codecs") || "") : ""
      };
    }

    var sets = period.getElementsByTagName("AdaptationSet");
    var videoTpl = null;
    var audioTpl = null;
    for (var i = 0; i < sets.length; i++) {
      var mime = sets[i].getAttribute("mimeType") || "";
      if (mime.indexOf("video") === 0 && !videoTpl) videoTpl = readTemplate(sets[i], wantedHeight, baseUrl);
      if (mime.indexOf("audio") === 0 && !audioTpl) audioTpl = readTemplate(sets[i], 0, baseUrl);
    }
    if (!videoTpl) throw new Error("No video SegmentTemplate");
    if (!audioTpl) throw new Error("No audio SegmentTemplate");

    return {
      availabilityStartTime: mpd.getAttribute("availabilityStartTime") || "",
      publishTime: mpd.getAttribute("publishTime") || "",
      periodIndex: periodIndex,
      periodStartMs: periodStartMs,
      baseUrl: baseUrl,
      video: videoTpl,
      audio: audioTpl,
      segmentSeconds: videoTpl.duration / videoTpl.timescale
    };
  }

  /* ------------------------------------------------------------------
   * 6. Player
   * ------------------------------------------------------------------ */
  function PBBStream(options) {
    var o = options || {};
    this.mount = o.mount || null;
    this.cameras = o.cameras || PBB_CAMERAS;
    this.video = o.video || null;
    this.quality = Number(o.quality) || 0;
    this.mediaSource = null;
    this.buffers = {};
    this.cryptoKey = null;
    this.manifest = null;
    this.camera = null;
    this.nextNumber = 0;
    this.running = false;
    this.pumpTimer = 0;
    this.refreshTimer = 0;
    this.fetchCache = { videoInit: null, audioInit: null };
    this.gen = 0;
    if (!this.video) this._buildUI();
  }

  PBBStream.prototype._buildUI = function () {
    var self = this;
    var wrap = document.createElement("div");
    wrap.className = "pbb-stream";
    wrap.style.cssText = "background:#0b0b0d;color:#ddd;font:13px/1.4 system-ui,sans-serif;padding:12px;border-radius:8px;max-width:960px;";
    this.mount = this.mount || document.body;

    var video = document.createElement("video");
    video.controls = true;
    video.muted = true;
    video.autoplay = true;
    video.playsInline = true;
    video.style.cssText = "width:100%;background:#000;border-radius:4px;";
    wrap.appendChild(video);

    var bar = document.createElement("div");
    bar.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;";
    this.cameras.forEach(function (cam) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = cam.id + " — " + cam.name;
      b.style.cssText = "background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:6px 10px;cursor:pointer;";
      b.addEventListener("click", function () { self.start(cam.id).catch(function (e) { self.log("ERROR " + e.message); }); });
      bar.appendChild(b);
    });
    wrap.appendChild(bar);

    var log = document.createElement("pre");
    log.style.cssText = "margin:0;min-height:80px;max-height:160px;overflow:auto;color:#7f8;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;";
    wrap.appendChild(log);

    this.mount.appendChild(wrap);
    this.video = video;
    this.logEl = log;
  };

  PBBStream.prototype.log = function (msg) {
    if (!this.logEl) return;
    var line = "[" + new Date().toISOString().slice(11, 19) + "] " + msg;
    this.logEl.textContent += (this.logEl.textContent ? "\n" : "") + line;
    this.logEl.scrollTop = this.logEl.scrollHeight;
  };

  PBBStream.prototype._fetch = async function (url) {
    var lastErr;
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, 12000);
        var res;
        var requestHeaders = { "Accept": "*/*" };
        try {
          res = await fetch(url, {
            method: "GET",
            headers: requestHeaders,
            mode: "cors",
            credentials: "same-origin",
            referrerPolicy: "no-referrer",
            cache: "no-store",
            signal: ctrl.signal
          });
        } finally {
          clearTimeout(timer);
        }
        if (res.status === 403) {
          throw new Error("Stream temporarily blocked (HTTP 403) — wait a moment, then reload.");
        }
        if (!res.ok) throw new Error("HTTP " + res.status + " for " + url.split("/").pop());
        return { bytes: new Uint8Array(await res.arrayBuffer()), date: res.headers.get("Date") };
      } catch (e) {
        lastErr = e;
        if (String(e && e.message || "").indexOf("403") >= 0) throw e;
        if (attempt < 2) await new Promise(function (r) { setTimeout(r, 300 * (attempt + 1)); });
      }
    }
    throw lastErr || new Error("fetch failed");
  };

  PBBStream.prototype.start = async function (camId) {
    this.gen++;
    await this.stop();

    this.camera = this.cameras.filter(function (c) { return c.id === Number(camId); })[0];
    if (!this.camera) throw new Error("Unknown camera " + camId);
    if (!this.camera.mpdUrl) return;

    if (!global.crypto || !global.crypto.subtle) throw new Error("WebCrypto unavailable — use https:// or http://localhost");
    this.cryptoKey = await global.crypto.subtle.importKey(
      "raw", hexToBytes(this.camera.key), { name: "AES-CTR" }, false, ["decrypt"]
    );

    this.log("camera " + this.camera.id + " — " + this.camera.name);
    var mpdUrlUsed = this.camera.mpdUrl;
    var mpdRes;
    try {
      mpdRes = await this._fetch(mpdUrlUsed);
    } catch (e) {
      var fallback = global.PBB_FALLBACK_MPD || FALLBACK_MPD_URL;
      if (!fallback) throw e;
      this.log("primary source failed — trying fallback");
      mpdUrlUsed = fallback;
      mpdRes = await this._fetch(mpdUrlUsed);
    }
    this.mpdUrlUsed = mpdUrlUsed;
    var mpdText = new TextDecoder().decode(mpdRes.bytes);
    // Split the query before finding the directory: some signed URLs contain
    // an unescaped https:// URL parameter with additional slashes.
    var mpdPath = mpdUrlUsed.split("?")[0];
    var base = mpdPath.slice(0, mpdPath.lastIndexOf("/") + 1);
    var queryIndex = mpdUrlUsed.indexOf("?");
    if (queryIndex >= 0) base += mpdUrlUsed.slice(queryIndex);
    this.serverDate = mpdRes.date ? Date.parse(mpdRes.date) : Date.now();
    this.serverLastSync = Date.now();
    this.manifest = parseMpd(mpdText, base, this.serverDate, this.quality);
    this.log("manifest ok — period " + (this.manifest.periodIndex + 1) + " — seg=" +
             this.manifest.segmentSeconds.toFixed(3) + "s");

    var vCodec = "video/mp4; codecs=\"" + (this.manifest.video.codecs || "avc1.4d4028") + "\"";
    var aCodec = "audio/mp4; codecs=\"" + (this.manifest.audio.codecs || "mp4a.40.2") + "\"";
    if (!global.MediaSource || !MediaSource.isTypeSupported(vCodec)) throw new Error("MSE unsupported: " + vCodec);

    var ms = new MediaSource();
    this.mediaSource = ms;
    this.video.src = URL.createObjectURL(ms);
    await new Promise(function (resolve, reject) {
      ms.addEventListener("sourceopen", resolve, { once: true });
      ms.addEventListener("error", function () { reject(new Error("MediaSource error")); }, { once: true });
    });

    this.buffers.video = ms.addSourceBuffer(vCodec);
    this.buffers.audio = ms.addSourceBuffer(aCodec);
    this.buffers.video.mode = "segments";
    this.buffers.audio.mode = "segments";

    var videoInit = toUint8Array((await this._fetch(this.manifest.video.initialization)).bytes);
    var audioInit = toUint8Array((await this._fetch(this.manifest.audio.initialization)).bytes);
    this.fetchCache.videoInit = cleanMp4InitInPlace(videoInit);
    this.fetchCache.audioInit = cleanMp4InitInPlace(audioInit);

    await this._append("video", this.fetchCache.videoInit);
    await this._append("audio", this.fetchCache.audioInit);
    this.log("init segments appended");

    this.running = true;
    this.nextNumber = this._currentNumber() - 1;
    this.baseNumber = this.nextNumber;
    this._pump();
    this.video.play().catch(function () {});

    var self = this;
    this.pumpTimer = setInterval(function () { self._pump().catch(function (e) { self.log("pump: " + e.message); }); }, 2000);

    // PROACTIVE SESSION ROTATION — signed URLs expire, so re-issue the manifest
    // on a fixed session clock BEFORE any 403/404 happens. Players keep loading
    // fresh segments with no stall. A failed refresh just retries next tick.
    var ROTATE_MS = 45000; // 45s — well inside the token lifetime
    this.rotateAt = Date.now() + ROTATE_MS;
    this.rotateFails = 0;
    this.refreshTimer = setInterval(function () {
      if (!self.running) return;
      var now = Date.now();
      if (now < self.rotateAt) return;
      self._refreshManifest().then(function () {
        self.rotateFails = 0;
        self.rotateAt = Date.now() + ROTATE_MS;
        self.log("token rotated ✅");
      }).catch(function () {
        self.rotateFails++;
        // back off on repeated failure, but keep trying (no stall)
        self.rotateAt = Date.now() + Math.min(ROTATE_MS, 5000 * self.rotateFails);
      });
    }, 5000);
    return this;
  };

  PBBStream.prototype.stop = function () {
    this.gen++;
    this.running = false;
    clearInterval(this.pumpTimer);
    clearInterval(this.refreshTimer);
    this.pumpTimer = 0;
    this.refreshTimer = 0;
    if (this.video) {
      this.video.pause();
      this.video.removeAttribute("src");
      this.video.load();
    }
    if (this.mediaSource && this.mediaSource.readyState === "open") {
      try { this.mediaSource.endOfStream(); } catch (e) {}
    }
    this.mediaSource = null;
    this.buffers = {};
    return Promise.resolve();
  };

  PBBStream.prototype._currentNumber = function () {
    var m = this.manifest;
    var serverNow = this.serverDate + (Date.now() - (this.serverLastSync || Date.now()));
    var elapsed = Math.max(0, (serverNow - m.periodStartMs) / 1000);
    return m.video.startNumber + Math.floor(elapsed / m.segmentSeconds) - 2;
  };

  PBBStream.prototype._refreshManifest = async function () {
    if (!this.running) return;
    var res = await this._fetch(this.mpdUrlUsed || this.camera.mpdUrl);
    var serverNow = res.date ? Date.parse(res.date) : Date.now();
    var m = parseMpd(new TextDecoder().decode(res.bytes), this.manifest.baseUrl, serverNow, this.quality);
    if (!m.video.startNumber) return;
    if (m.periodStartMs !== this.manifest.periodStartMs) {
      this.log("period rollover -> period " + (m.periodIndex + 1) + " (start " + m.video.startNumber + ")");
      this.nextNumber = m.video.startNumber;
      await this._append("video", this.fetchCache.videoInit);
      await this._append("audio", this.fetchCache.audioInit);
    }
    this.manifest = m;
    this.serverDate = serverNow;
    this.serverLastSync = Date.now();
  };

  PBBStream.prototype._append = function (type, u8, gen) {
    if (gen !== undefined && gen !== this.gen) return Promise.resolve();
    var sb = this.buffers[type];
    if (!sb) return Promise.resolve();

    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("append timeout (" + type + ")")); }, 10000);
      var onUpdateEnd = function () {
        clearTimeout(timer);
        sb.removeEventListener("updateend", onUpdateEnd);
        sb.removeEventListener("error", onError);
        resolve();
      };
      var onError = function (e) {
        clearTimeout(timer);
        sb.removeEventListener("updateend", onUpdateEnd);
        sb.removeEventListener("error", onError);
        reject(new Error("SourceBuffer error (" + type + ")"));
      };
      sb.addEventListener("updateend", onUpdateEnd, { once: true });
      sb.addEventListener("error", onError, { once: true });
      try {
        sb.appendBuffer(u8);
      } catch (e) {
        clearTimeout(timer);
        sb.removeEventListener("updateend", onUpdateEnd);
        sb.removeEventListener("error", onError);
        reject(e);
      }
    });
  };

  PBBStream.prototype._pump = async function () {
    if (!this.running || !this.manifest) return;
    var gen = this.gen;
    var m = this.manifest;
    var target = this._currentNumber();

    if (target - this.nextNumber > 3) {
      this.log("catch-up: skip " + (target - this.nextNumber - 2) + " segments");
      this.nextNumber = target - 2;
      this.baseNumber = this.nextNumber;
    }
    if (this.nextNumber < m.video.startNumber) {
      this.nextNumber = m.video.startNumber;
      this.baseNumber = this.nextNumber;
    }

    var appended = 0;
    for (var n = this.nextNumber; n <= target && appended < 3 && this.running; n++) {
      var vUrl = m.video.media.replace("$Number$", String(n));
      var aUrl = m.audio.media.replace("$Number$", String(n));

      try {
        var vRes = await this._fetch(vUrl);
        var aRes = await this._fetch(aUrl);
        if (gen !== this.gen || !this.running) return;
        var vSeg = await decryptMp4SegmentInPlace(toUint8Array(vRes.bytes), this.cryptoKey);
        var aSeg = await decryptMp4SegmentInPlace(toUint8Array(aRes.bytes), this.cryptoKey);

/*
 * Google Drive upload for PBBLIVE.TOP recordings.
 *
 * SETUP (one time):
 *  1. Go to https://console.cloud.google.com/apis/credentials
 *  2. Create an OAuth client ID of type "Web application".
 *  3. Add http://localhost:8080 to Authorized JavaScript origins.
 *  4. Enable the Google Drive API for that project.
 *  5. Paste the client ID below.
 *
 * Nothing is loaded from Google until the user clicks Upload, and even then
 * only if a real client ID has been configured.
 */
(function (global) {
  "use strict";

  var CONFIG = {
    clientId: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  };
  var SCOPE = "https://www.googleapis.com/auth/drive.file";
  var accessToken = null;
  var GIS_SRC = "https://accounts.google.com/gsi/client";

  function isConfigured() {
    return CONFIG.clientId && CONFIG.clientId.indexOf("YOUR_") !== 0 && CONFIG.clientId.length > 20;
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[src="' + src + '"]');
      if (existing && global.google && global.google.accounts) return resolve();
      var s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("Could not load Google sign-in")); };
      document.head.appendChild(s);
    });
  }

  function getToken() {
    if (accessToken) return Promise.resolve(accessToken);
    if (!isConfigured()) return Promise.reject(new Error("Google Client ID not set — edit google-drive.js"));

    return loadScript(GIS_SRC).then(function () {
      return new Promise(function (resolve, reject) {
        var client = global.google.accounts.oauth2.initTokenClient({
          client_id: CONFIG.clientId,
          scope: SCOPE,
          callback: function (res) {
            if (res && res.error) return reject(new Error(res.error));
            if (!res || !res.access_token) return reject(new Error("No access token returned"));
            accessToken = res.access_token;
            resolve(accessToken);
          },
          error_callback: function (e) {
            reject(new Error((e && e.type) || "Google sign-in failed"));
          }
        });
        client.requestAccessToken({ prompt: accessToken ? "" : "consent" });
      });
    });
  }

  function multipartBody(blob, fileName) {
    var boundary = "----PBBLiveBoundary" + Date.now();
    var mime = blob.type || "video/mp4";
    var meta = { name: fileName, mimeType: mime };
    var head = "--" + boundary + "\r\n" +
      "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(meta) + "\r\n" +
      "--" + boundary + "\r\n" +
      "Content-Type: " + mime + "\r\n\r\n";
    var tail = "\r\n--" + boundary + "--\r\n";
    return new Blob([head, blob, tail], { type: "multipart/related; boundary=" + boundary });
  }

    return getToken().then(function (token) {
      var body = multipartBody(blob, fileName);
      return fetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",
        {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": body.type

          return res.text().then(function (t) {

          });
        }
        return res.json();
      });
    });

    config: CONFIG,
    isConfigured: isConfigured,
    upload: upload,
    resetToken: function () { accessToken = null; }
  };

        if (file.webViewLink) window.open(file.webViewLink, "_blank", "noopener");
      }).catch(function (e) {
        toast("Upload failed: " + e.message, true);
      }).then(function () { btn.disabled = false; });
    };
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ------------------------------------------------------------------
   * Recording
   * ------------------------------------------------------------------ */
  function camLabel(id) {
    var c = PBB_CAMERAS.filter(function (x) { return x.id === Number(id); })[0];
    return c ? c.name.replace(/\s+/g, "") : "Main";
  }

  async function pickEncoder(canvas, audioTrack, profile) {
    if (!window.VideoEncoder || !window.VideoFrame || !window.Mp4Muxer) return null;
    var W = canvas.width, H = canvas.height;
    profile = profile || recProfile();
    var candidates = [
      { web: "avc1.42001f", mux: "avc" },
      { web: "avc1.4d001f", mux: "avc" },
      { web: "avc1.64001f", mux: "avc" }
    ];
    var chosen = null;
    for (var i = 0; i < candidates.length; i++) {
      try {
        var cfg = { codec: candidates[i].web, width: W, height: H, bitrate: profile.bitrate, framerate: profile.fps, latencyMode: "realtime" };
        if (candidates[i].mux === "avc") cfg.avc = { format: "avc" };
        var sup = await VideoEncoder.isConfigSupported(cfg);
        if (sup && sup.supported) { chosen = { web: candidates[i].web, mux: candidates[i].mux, config: sup.config || cfg }; break; }
      } catch (e) {}
    }
    if (!chosen) return null;

    var target = new Mp4Muxer.ArrayBufferTarget();
    var muxerOptions = {
      target: target,
      video: { codec: chosen.mux, width: W, height: H },
      fastStart: "in-memory",
      firstTimestampBehavior: "offset"
    };
    if (audioTrack) {
      muxerOptions.audio = { codec: "aac", numberOfChannels: 2, sampleRate: 48000 };
    }
    var muxer = new Mp4Muxer.Muxer(muxerOptions);
    var failed = false;
    var engineDebug = { chunks: 0, lastError: "" };
    var encoder = new VideoEncoder({
      output: function (chunk, meta) {
        engineDebug.chunks++;
        try { muxer.addVideoChunk(chunk, meta); }
        catch (e) { engineDebug.lastError = String(e && e.message || e); }
      },
      error: function (e) { failed = true; engineDebug.lastError = String(e && e.message || e); }
    });
    encoder.configure(chosen.config);
    if (failed) return null;
    return {
      encoder: encoder, muxer: muxer, target: target,
      format: "MP4 (H.264 / ISO-BMFF + AAC)" , debug: engineDebug,
      audioTrack: audioTrack || null
    };
  }

  function drawFit(ctx, video, x, y, w, h) {
    ctx.fillStyle = "#000";
    ctx.fillRect(x, y, w, h);
    var vw = video && video.videoWidth, vh = video && video.videoHeight;
    if (!vw || !vh) return;
    var scale = Math.min(w / vw, h / vh);
    var dw = vw * scale, dh = vh * scale;
    try { ctx.drawImage(video, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); } catch (e) {}
  }

  function layoutRects(n, W, H) {
    if (n <= 1) return [[0, 0, W, H]];
    if (n === 2) return [[0, 0, W / 2, H], [W / 2, 0, W / 2, H]];
    // Two-camera view: side-by-side on desktop, stacked on smaller screens.
    if (n === 3) return [[0, 0, W * 0.65, H], [W * 0.65, 0, W * 0.35, H / 2], [W * 0.65, H / 2, W * 0.35, H / 2]];
    return [[0, 0, W / 2, H / 2], [W / 2, 0, W / 2, H / 2],
            [0, H / 2, W / 2, H / 2], [W / 2, H / 2, W / 2, H / 2]];
  }

  function recordSources() {
    if (state.expanded) {
      var one = videoOf(state.expanded);
      return one && one.videoWidth ? [one] : [firstVisibleVideo()];
    }
    var ids = VIEW_IDS[state.view] || [Number(state.view)];
    var list = [];
    ids.forEach(function (id) {
      var v = videoOf(id);
      if (v && v.videoWidth) list.push(v);
    });
    if (!list.length) list.push(firstVisibleVideo());
    return list;
  }

  function sourceLabel() {
    if (state.expanded) return camLabel(state.expanded);
    if (state.view === "duo") return "2View";
    if (state.view === "trio") return "3View";
    if (state.view === "all") return "4View";
    return camLabel(state.view);
  }

  function attachAudioEncoder(rec, engine) {
    var track = engine.audioTrack;
    if (!track || typeof AudioEncoder === "undefined" || typeof MediaStreamTrackProcessor === "undefined") return;
    try {
      var audioEncoder = new AudioEncoder({
        output: function (chunk, meta) {
          try { engine.muxer.addAudioChunk(chunk, meta); }
          catch (e) { engine.debug.audioError = String(e && e.message || e); }
        },
        error: function (e) { engine.debug.audioError = String(e && e.message || e); }
      });
      audioEncoder.configure({
        codec: "mp4a.40.2",
        sampleRate: 48000,
        numberOfChannels: 2,
        bitrate: 128000
      });
      var processor = new MediaStreamTrackProcessor({ track: track });
      var reader = processor.readable.getReader();
      engine.audioEncoder = audioEncoder;
      engine.audioPump = (async function () {
        try {
          while (rec.active) {
            var result = await reader.read();
            if (result.done) break;
            var data = result.value;
            try { audioEncoder.encode(data); } catch (e) {}
            try { data.close(); } catch (e) {}
          }
        } catch (e) {}
      })();
    } catch (e) {
      engine.debug.audioError = String(e && e.message || e);
    }
  }

  function startRecording() {
    if (recorder && recorder.active) return;
    var sources = recordSources().filter(function (v) { return !!v; });
    if (!sources.length || !sources[0].videoWidth) {
      toast("Recording unavailable — wait for the video to load.", true);
      return;
    }

    var profile = recProfile();
    var canvas = document.createElement("canvas");
    canvas.width = profile.w;
    canvas.height = profile.h;
    var ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

    // Record the composited canvas so every visible camera is captured.
    var stream = canvas.captureStream ? canvas.captureStream(profile.fps)
      : ((sources[0].captureStream || sources[0].mozCaptureStream).call(sources[0], profile.fps));
    sources.forEach(function (v) {
      try {
        (v.captureStream ? v.captureStream(0) : (v.mozCaptureStream && v.mozCaptureStream(0))).getAudioTracks().forEach(function (t) {
          stream.addTrack(t);
        });
      } catch (e) {}
    });

    var audioTrack = stream.getAudioTracks()[0] || null;
    var t0 = performance.now();
    var startedAt = new Date();
    var camName = sourceLabel();
    var rects = layoutRects(sources.length, canvas.width, canvas.height);
    var rec = {
      active: true, sources: sources, rects: rects, canvas: canvas, ctx: ctx, stream: stream,
      t0: t0, startedAt: startedAt, camName: camName, profile: profile,
      engine: null, frameIndex: 0, chunks: [], mime: "",
      firstTs: null, drawTimer: 0, timer: 0
    };
    recorder = rec;

    $("#zv-rec-details-card").hidden = true;
    var hud = $(".zv-rec-hud");
    if (hud) hud.hidden = false;
    document.body.classList.add("is-recording");

    rec.timer = setInterval(function () {
      var s = fmtDuration(performance.now() - rec.t0);
      var timer = $("#quick-record-timer"); if (timer) timer.textContent = s;
      var wt = $(".wc-rec-timer"); if (wt) wt.textContent = s;
      var ht = $(".zv-rec-hud-time"); if (ht) ht.textContent = s;
    }, 250);

    function drawFrame() {
      if (!rec.active) return;
      // Backpressure: if the encoder is falling behind, skip frames instead of
      // queueing them up (which causes laggy, delayed recording on mobile).
      var q = 0;
      if (rec.engine && rec.engine.encoder.state === "configured") {
        q = rec.engine.encoder.encodeQueueSize || 0;
      }
      if (q <= 2) {
        for (var i = 0; i < rec.sources.length; i++) {
          var r = rec.rects[i];
          drawFit(ctx, rec.sources[i], r[0], r[1], r[2], r[3]);
        }
      }
      if (rec.engine && rec.engine.encoder.state === "configured") {
        if (q <= 2) {
          try {
            if (rec.firstTs === null) rec.firstTs = performance.now();
            var ts = Math.round((performance.now() - rec.firstTs) * 1000);
            var frame = new VideoFrame(canvas, { timestamp: ts, duration: Math.round(1000000 / profile.fps) });
            rec.engine.encoder.encode(frame, { keyFrame: rec.frameIndex % (profile.fps * 2) === 0 });
            frame.close();
            rec.frameIndex++;
          } catch (e) {}
        }
      }
      rec.drawTimer = setTimeout(drawFrame, profile.interval);
    }

    pickEncoder(canvas, audioTrack, profile).then(function (engine) {
      if (!rec.active) { if (engine) { try { engine.encoder.close(); } catch (e) {} } return; }
      if (engine) {
        rec.engine = engine;
        attachAudioEncoder(rec, engine);
        drawFrame();
        return;
      }
      var candidates = [
        "video/mp4;codecs=avc1.42E01E",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];
      var mime = "";
      for (var i = 0; i < candidates.length; i++) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) { mime = candidates[i]; break; }
      }
      rec.mime = mime;
      try {
        var mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        rec.mediaRecorder = mr;
        mr.ondataavailable = function (e) { if (e.data && e.data.size) rec.chunks.push(e.data); };
        mr.start(1000);
        drawFrame();
      } catch (e) {
        toast("Recording could not start: " + e.message, true);
        stopRecording();
      }
    });
  }

  function stopRecording() {
    var rec = recorder;
    if (!rec || !rec.active) return;
    rec.active = false;
    clearTimeout(rec.drawTimer);
    clearInterval(rec.timer);
    if ($(".zv-rec-hud")) $(".zv-rec-hud").hidden = true;
    document.body.classList.remove("is-recording");
    var reset = function () {
      $("#quick-record-timer").textContent = "Record";
      $(".wc-rec-timer").textContent = "Record";
    };
    reset();

    var elapsed = performance.now() - rec.t0;
    var isMp4 = rec.engine || (rec.mime && rec.mime.indexOf("mp4") >= 0);
    var ext = isMp4 ? "mp4" : "webm";
    var fileName = "PBBLIVE-" + rec.camName.replace(/\s+/g, "") + "-" + stampName(rec.startedAt) + "." + ext;

    function finish(blob, format) {
      rec.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showDetailsCard({
        url: url,
        blob: blob,
        fileName: fileName,
        cameraName: rec.camName,
        format: format,
        duration: fmtDuration(elapsed),
        size: (blob.size / 1024).toFixed(1) + " KB",
        resolution: rec.canvas.width + "×" + rec.canvas.height + " (" + rec.profile.fps + " fps)",
        recordedAt: rec.startedAt
      });
      toast("Recording saved: " + fileName);
      recorder = null;
    }

    if (rec.engine) {
      var eng = rec.engine;
      var flushVideo = eng.encoder.flush();
      var flushAudio = eng.audioEncoder ? eng.audioEncoder.flush().catch(function () {}) : Promise.resolve();
      Promise.all([flushVideo, flushAudio]).then(function () {
        eng.muxer.finalize();
        finish(new Blob([eng.target.buffer], { type: "video/mp4" }), eng.format);
      }).catch(function () {
        finish(new Blob([], { type: "video/mp4" }), "MP4 (H.264 / ISO-BMFF)");
      });
    } else if (rec.mediaRecorder) {
      rec.mediaRecorder.onstop = function () {
        finish(new Blob(rec.chunks, { type: rec.mime || "video/webm" }),
          isMp4 ? "MP4 (H.264 / ISO-BMFF)" : "WebM (VP9 / Opus)");
      };
      rec.mediaRecorder.stop();
    } else {
      finish(new Blob(rec.chunks, { type: "video/webm" }), "WebM");
    }
  }

  /* ------------------------------------------------------------------
   * Theme, reactions, misc wiring
   * ------------------------------------------------------------------ */
  function initViewers() {
    var el = $("#header-viewer-count");
    if (el) el.textContent = "1";
    // Live viewer counting removed — the /api/* endpoints are rate-limited by
    // Cloudflare. Static count keeps the UI clean with zero API requests.
  }

  function initTheme() {
    var saved = localStorage.getItem("pbb_theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    var btn = $("#theme-toggle");
    if (btn) btn.addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      document.body.setAttribute("data-theme", next);
      localStorage.setItem("pbb_theme", next);
    });
  }

  function initReactions() {
    var counts = { primo: 1.1e6, nathan: 1.9e6, jeo: 439600, gehlee: 212400 };
    var els = {
      primo: $("#react-count-primo"),
      nathan: $("#react-count-nathan"),
      jeo: $("#react-count-jeo"),
      gehlee: $("#react-count-gehlee")
    };
    var combos = {};

    function spawnFloat(key, combo) {
      var dock = $("#live-reactions-bar");
      if (!dock) return;
      var btn = $('[data-react="' + key + '"]');
      var img = btn && $(".v-react-img", btn);
      if (!img) return;
      var el = document.createElement("div");
      el.className = "pbb-react-float";
      var pic = document.createElement("img");
      pic.src = img.src;
      pic.alt = "";
      el.appendChild(pic);
      if (combo > 1) {
        var tag = document.createElement("span");
        tag.className = "pbb-combo";
        tag.textContent = "x" + combo;
        el.appendChild(tag);
      }
      el.style.right = (18 + Math.random() * 44) + "px";
      el.style.bottom = (96 + Math.random() * 40) + "px";
      dock.appendChild(el);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1500);
    }
    function label(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return String(n);
    }
    $$("[data-react]").forEach(function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-react");
        var now = Date.now();
        if (!combos[k] || now - combos[k].t > 1200) combos[k] = { t: now, n: 0 };
        combos[k].t = now;
        combos[k].n += 1;
        counts[k] += 1;
        if (els[k]) els[k].textContent = label(counts[k]);
        spawnFloat(k, combos[k].n);
        b.classList.remove("pulse");
        void b.offsetWidth;
        b.classList.add("pulse");
      });
    });

    var welcomeBtn = $("#welcome-btn");
    if (welcomeBtn) welcomeBtn.addEventListener("click", function () {
      welcomeBtn.classList.remove("waving");
      void welcomeBtn.offsetWidth;
      welcomeBtn.classList.add("waving");

      var dock = $("#live-reactions-bar");
      if (dock) {
        var el = document.createElement("div");
        el.className = "pbb-welcome-float";
        el.textContent = "WELCOME!";
        dock.appendChild(el);
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1500);
      }
      showControls();
    });
  }

  function initControls() {
    $$(".wall-tile video", wall).forEach(function (v) {
      ["play", "pause", "ended", "loadedmetadata", "canplay"].forEach(function (eventName) {
        v.addEventListener(eventName, syncPlaybackButton);
      });
    });

    navButtons.forEach(function (b) {
      b.addEventListener("click", function () {
        state.userInteracted = true;
        applyView(b.getAttribute("data-cam"));
      });
    });

    var playBtn = $("#wc-play-btn");
    if (playBtn) playBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      state.userInteracted = true;
      var v = activeVideo() || firstVisibleVideo();
      if (!v) return;
      if (v.paused || v.ended) {
        var promise = v.play();
        if (promise && promise.catch) promise.catch(function () {});
      } else {
        v.pause();
      }
      syncPlaybackButton();
      showControls();
    });

    $$(".mv-audio").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.userInteracted = true;
        var id = Number(btn.getAttribute("data-audio"));
        state.audioFocus = state.audioFocus === id ? null : id;
        applyAudio();
      });
    });

    var allAudio = $("#wc-all-audio");
    if (allAudio) allAudio.addEventListener("click", function () {
      state.userInteracted = true;
      state.audioFocus = state.audioFocus === "all" ? null : "all";
      applyAudio();
    });

    $$(".wall-tile", wall).forEach(function (t) {
      t.addEventListener("click", function () {
        if (!VIEW_IDS[state.view]) return;
        var id = Number(t.getAttribute("data-id"));
        var already = t.classList.contains("expanded");
        wall.classList.toggle("expanded", !already);
        $$(".wall-tile", wall).forEach(function (x) { x.classList.toggle("expanded", !already && x === t); });
        state.expanded = already ? null : id;
        applyTransform();
        updateZoomUI();
      });
    });

    // VOL button — tap cycles 0..10, wraps back to 0. 0 = muted.
    var volBtn = $("#wc-vol-btn");
    if (volBtn) volBtn.addEventListener("click", function () {
      state.userInteracted = true;
      ensureAudioBoost();
      var level = Math.round(state.volume * 10);
      level = level >= 10 ? 0 : level + 1;
      state.volume = level / 10;
      if (level === 0) {
        state.audioFocus = null;
      } else if (!state.audioFocus) {
        var ids = VIEW_IDS[state.view] || [Number(state.view)];
        state.audioFocus = ids[0] || 1;
      }
      applyAudio();
    });

    var out = $(".wc-zoom-out"); if (out) out.onclick = function () { setZoom(state.zoom - 0.5); };
    var inc = $(".wc-zoom-in"); if (inc) inc.onclick = function () { setZoom(state.zoom + 0.5); };
    var rst = $(".wc-zoom-reset"); if (rst) rst.onclick = function () { setZoom(1); };
    var hud = $(".zv-zoom-hud"); if (hud) hud.onclick = function () { setZoom(1); };

    var q = $(".wc-quality");
    if (q) q.addEventListener("change", function () {
      state.userInteracted = true;
      state.quality = q.value === "auto" ? 0 : Number(q.value);
      if (state.view === "all") applyView("all");
      else applyView(state.view);
    });

    var recBtn = $(".wc-rec-btn"); if (recBtn) recBtn.onclick = function () {
      recorder && recorder.active ? stopRecording() : startRecording();
    };
    var quick = $("#quick-record-btn"); if (quick) quick.onclick = function () {
      recorder && recorder.active ? stopRecording() : startRecording();
    };
    var recHud = $(".zv-rec-hud"); if (recHud) recHud.onclick = stopRecording;

    var fs = $(".wc-fs"); if (fs) fs.onclick = function () {
      var doc = document;
      var pseudo = container && container.classList.contains("pseudo-fs");
      if (doc.fullscreenElement || doc.webkitFullscreenElement || pseudo) {
        if (pseudo) {
          container.classList.remove("pseudo-fs");
          document.body.classList.remove("pseudo-fs-active");
          syncFullscreenState();
          showControls();
          return;
        }
        var exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen;
        if (exit) {
          try { exit.call(doc); } catch (e) {}
        }
        return;
      }

      var enterPseudo = function () {
        if (!container) return;
        container.classList.add("pseudo-fs");
        document.body.classList.add("pseudo-fs-active");
        syncFullscreenState();
        showControls();
      };
      var target = container || document.documentElement;
      var req = target.requestFullscreen || target.webkitRequestFullscreen ||
                target.webkitRequestFullScreen || target.mozRequestFullScreen;
      if (!req) {
        enterPseudo();
        return;
      }
      try {
        var request = req.call(target);
        if (request && request.catch) request.catch(enterPseudo);
      } catch (e) {
        enterPseudo();
      }
    };
    ["fullscreenchange", "webkitfullscreenchange"].forEach(function (eventName) {
      document.addEventListener(eventName, syncFullscreenState);
    });
    syncFullscreenState();

    // pointer drag to pan while zoomed
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    wall.addEventListener("pointerdown", function (e) {
      if (state.zoom <= 1 || e.target.tagName !== "VIDEO") return;
      dragging = true; sx = e.clientX; sy = e.clientY; ox = state.panX; oy = state.panY;
      e.target.setPointerCapture(e.pointerId);
    });
    wall.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      state.panX = ox + (e.clientX - sx);
      state.panY = oy + (e.clientY - sy);
      applyTransform();
    });
    var endDrag = function () { dragging = false; };
    wall.addEventListener("pointerup", endDrag);
    wall.addEventListener("pointercancel", endDrag);
  }

  var idleTimer = 0;
  function showControls() {
    if (!container) return;
    container.classList.remove("pbb-idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      var v = activeVideo() || firstVisibleVideo();
      if (v && !v.paused && v.readyState >= 2) container.classList.add("pbb-idle");
    }, 3000);
  }

  function initIdleControls() {
    if (!container) return;
    ["pointermove", "pointerdown", "touchstart", "click", "keydown"].forEach(function (ev) {
      container.addEventListener(ev, showControls, { passive: true });
    });
    container.addEventListener("pointerleave", function () {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { container.classList.add("pbb-idle"); }, 1200);
    });
    showControls();
  }

  function init() {
    initTheme();
    initControls();
    initReactions();
    initViewers();
    initIdleControls();
    applyView(1);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
<script>
(function(){
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var id = localStorage.getItem('pbb_vid');
  if(!id){ id='v'+Math.random().toString(36).slice(2,10); localStorage.setItem('pbb_vid',id); }
  var nodes=[document.getElementById('header-viewer-count'),document.getElementById('viewersInline'),document.getElementById('viewers')].filter(Boolean);
  function paint(n){
    n=Math.max(1,n);
    nodes.forEach(function(el,i){ el.textContent = i===1 ? n+' watching' : String(n); });
  }
  function ping(){
    fetch('/api/viewers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
      .then(function(r){return r.json();}).then(function(d){paint(d.count||1);}).catch(function(){});
  }
  ping();
  setInterval(ping,15000);
  window.addEventListener('focus',ping,{passive:true});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)ping();},{passive:true});
})();
</script>
<script>
(function(){
  var btn=document.getElementById('tapUnmute');
  if(!btn)return;
  function sync(){
    var vids=[].slice.call(document.querySelectorAll('.wall-tile video'));
    btn.hidden=vids.some(function(v){return !v.muted;});
  }
  btn.addEventListener('click',function(){
    var all=document.getElementById('wc-all-audio');
    if(all && !all.classList.contains('is-active')) all.click();
    else [].slice.call(document.querySelectorAll('.wall-tile video')).forEach(function(v){v.muted=false;});
    sync();
  });
  document.addEventListener('click',function(e){
    if(e.target.closest && e.target.closest('.mv-audio,#wc-all-audio,#wc-vol-btn')) setTimeout(sync,50);
  },{passive:true});
  setInterval(sync,1000);
  sync();
})();
</script>
<style id="pbb-guest-chat-css">
#gcFab{position:fixed;right:14px;bottom:16px;z-index:60;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:#9c7eff;color:#0d0618;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#gcPanel{position:fixed;right:14px;bottom:64px;z-index:60;width:min(340px,calc(100vw - 28px));height:min(420px,65vh);display:none;flex-direction:column;background:rgba(13,10,24,.97);border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px)}
#gcPanel.open{display:flex}
#gcHead{padding:9px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.1);color:#f4f1ff}
#gcList{flex:1;overflow-y:auto;padding:8px 10px;font-size:12px;color:#e8e4f2}
.gcMsg{margin:0 0 7px;word-break:break-word}.gcMsg b{color:#9c7eff;margin-right:5px}.gcMsg small{color:#8b83a0;margin-left:6px;font-size:9px}
#gcForm{display:flex;gap:6px;padding:8px;border-top:1px solid rgba(255,255,255,.1)}
#gcInput{flex:1;min-width:0;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;outline:none;font-size:12px}
#gcForm button{padding:8px 13px;border:0;border-radius:999px;background:#9c7eff;color:#0d0618;font-weight:800;font-size:12px;cursor:pointer}
#gcHint{padding:0 10px 8px;font-size:10px;color:#8b83a0}
</style>
<button id="gcFab" type="button">💬 Guest chat</button>
<div id="gcPanel" role="dialog" aria-label="Guest chat">
  <div id="gcHead">Guest chat <span style="float:right;font-weight:500;font-size:10px;opacity:.7">guests only · 4s slow mode</span></div>
  <div id="gcList"></div>
  <div id="gcHint"></div>
  <form id="gcForm"><input id="gcInput" maxlength="160" placeholder="Type a message…" autocomplete="off"><button type="submit">Send</button></form>
</div>
<script>
(function(){
  var fab=document.getElementById('gcFab'),panel=document.getElementById('gcPanel'),list=document.getElementById('gcList'),form=document.getElementById('gcForm'),input=document.getElementById('gcInput'),hint=document.getElementById('gcHint');
  if(!fab||!panel||!form)return;
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    fab.style.display = "none";
    return;
  }
  var sid=localStorage.getItem('gc_sid');if(!sid){sid='g'+Math.random().toString(36).slice(2,12);localStorage.setItem('gc_sid',sid);}
  var name=localStorage.getItem('gc_name')||('Guest '+Math.floor(100+Math.random()*900));localStorage.setItem('gc_name',name);
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function paint(msgs){list.innerHTML=(msgs||[]).map(function(m){return '<div class="gcMsg"><b>'+esc(m.name)+'</b>'+esc(m.text)+'<small>'+new Date(m.ts).toLocaleTimeString()+'</small></div>';}).join('');list.scrollTop=list.scrollHeight;}
  function poll(){fetch('/api/chat',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){paint(d.messages||[]);}).catch(function(){});}
  poll();setInterval(poll,5000);
  fab.onclick=function(){panel.classList.toggle('open');if(panel.classList.contains('open'))poll();};
  var lastSend=0;
  form.onsubmit=function(e){
    e.preventDefault();var text=input.value.trim();if(!text)return;
    var now=Date.now();if(now-lastSend<4000){hint.textContent='Wait 4 seconds before sending again.';return;}
    lastSend=now;hint.textContent='';
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,name:name,sid:sid})}).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});}).then(function(x){
      if(x.ok){input.value='';hint.textContent='';poll();}else{hint.textContent=x.d.error||'Could not send.';}
    }).catch(function(){hint.textContent='Could not send.';});
  };
})();
</script>
